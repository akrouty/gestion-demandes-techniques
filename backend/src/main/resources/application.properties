spring.application.name=gestion-demandes-techniques-backend

# PostgreSQL — configuration par variables d'environnement.
# Aucun secret réel n'est versionné ; aucune valeur par défaut pour le mot de passe.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_demandes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est géré par Flyway ; Hibernate ne fait que valider la cohérence.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# --- Sécurité (Bloc 2) — configuration externe obligatoire. ---
# Aucun secret, issuer, durée, algorithme ni facteur de coût codé en dur,
# aucun repli : une valeur absente ou invalide provoque un échec explicite
# de démarrage sans jamais révéler un secret.
# JWT_SECRET      : secret HMAC fort (>= 32 octets pour HS256), jamais versionné.
# JWT_ISSUER      : valeur du claim iss.
# JWT_TTL         : durée de vie (ex. PT15M) ; exp = iat + TTL.
# JWT_ALGORITHM   : HS256, HS384 ou HS512 (algorithme épinglé côté serveur).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.ttl=${JWT_TTL}
app.security.jwt.algorithm=${JWT_ALGORITHM}

# PASSWORD_MIN_LENGTH : longueur minimale du mot de passe initial (> 0).
# BCRYPT_STRENGTH     : facteur de coût BCrypt (4-31), à mesurer sur l'environnement cible.
app.password.min-length=${PASSWORD_MIN_LENGTH}
app.password.bcrypt-strength=${BCRYPT_STRENGTH}

# CORS_ALLOWED_ORIGINS : origines frontend autorisées, séparées par des virgules.
# Vide ou absent = aucune origine autorisée (aucun wildcard, aucune ouverture par défaut).
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

