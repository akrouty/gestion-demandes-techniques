# Environnement de test isolé (H2, dépendance scope test uniquement).
# Il sert au smoke test Spring et aux tests JPA rapides.
# Il ne remplace JAMAIS la validation du schéma PostgreSQL réel.
spring.datasource.url=jdbc:h2:mem:gdt_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Seule configuration de test autorisée à générer le schéma.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
