# Environnement de test isolé (H2, dépendance scope test uniquement).
# Il sert au smoke test Spring et aux tests JPA rapides.
# Il ne remplace JAMAIS la validation du schéma PostgreSQL réel.
spring.datasource.url=jdbc:h2:mem:gdt_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Seule configuration de test autorisée à générer le schéma.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# --- Paramètres de sécurité TEST uniquement (jamais une configuration production). ---
# Secret HMAC de test (64 octets, suffisant pour HS256 et HS512 de test), issuer
# et TTL de test, algorithme de test, facteur BCrypt réduit pour accélérer les
# tests, longueur minimale de test et origine CORS de test.
app.security.jwt.secret=test-only-jwt-hmac-signing-key-0123456789abcdef0123456789abcdefz
app.security.jwt.issuer=gestion-demandes-techniques-test
app.security.jwt.ttl=PT5M
app.security.jwt.algorithm=HS256
app.password.min-length=8
app.password.bcrypt-strength=4
app.security.cors.allowed-origins=http://localhost:4200
