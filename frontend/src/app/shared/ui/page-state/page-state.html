<section
  class="page-state"
  [class]="'page-state state-' + kind()"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  [attr.aria-busy]="kind() === 'loading'"
>
  <span class="state-marker" aria-hidden="true">{{
    kind() === 'error' ? '!' : kind() === 'success' ? '✓' : kind() === 'loading' ? '…' : '—'
  }}</span>
  <h2>{{ title() }}</h2>
  <p>{{ message() }}</p>
</section>
